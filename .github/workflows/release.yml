name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb + CLI tarball)
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macOS arm64 (dmg + CLI tarball)
            runs-on: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x86_64 (dmg + CLI tarball)
            runs-on: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build Linux Debian package and CLI tarball
        if: runner.os == 'Linux'
        env:
          # Tag-derived version, e.g. v0.1.2 -> 0.1.2; bundle names follow it.
          FOLGLIO_VERSION: ${{ github.ref_name }}
          FOLGLIO_TARGET: ${{ matrix.target }}
        run: |
          export FOLGLIO_VERSION="${FOLGLIO_VERSION#v}"
          bash scripts/package-linux.sh
          bash scripts/package-release.sh
      - name: Add the cross-compilation target
        if: runner.os == 'macOS'
        run: rustup target add "${{ matrix.target }}"
      - name: Build macOS dmg and CLI tarball
        if: runner.os == 'macOS'
        env:
          FOLGLIO_VERSION: ${{ github.ref_name }}
          FOLGLIO_TARGET: ${{ matrix.target }}
        run: |
          export FOLGLIO_VERSION="${FOLGLIO_VERSION#v}"
          cd apps/desktop
          npm ci
          npm run typecheck
          override="../../target/release-version.conf.json"
          mkdir -p ../../target
          printf '{"version": "%s"}\n' "$FOLGLIO_VERSION" > "$override"
          npm run tauri -- build --bundles dmg --config "$override" --target "${{ matrix.target }}" -- --locked
          cd ../..
          bash scripts/package-release.sh
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find target -path '*bundle/deb/*.deb' -exec cp {} dist/ \;
          find target -path '*bundle/dmg/*.dmg' -exec cp {} dist/ \;
          find target -path '*/release/foglio-notes-v*.tar.gz' -exec cp {} dist/ \;
          ls -l dist/
      - name: Install minisign
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y minisign
          else
            brew install minisign
          fi
      - name: Sign the release manifest and checksums
        env:
          # Unencrypted release signing key; the private key only ever exists
          # in this secret and never in the repository.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          key=$(mktemp)
          printf '%s' "$MINISIGN_SECRET_KEY" > "$key"
          chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          # The desktop app verifies release.txt against its embedded public
          # key before showing a signed update notice.
          printf '%s\n' "$GITHUB_REF_NAME" > dist/release.txt
          minisign -Sm dist/release.txt -s "$key"
          # Checksums let users verify any download independently of the app.
          # Each platform only has its own artifact kinds, so checksum whatever
          # exists instead of globbing all three patterns literally.
          (cd dist && find . -maxdepth 1 -type f \( -name '*.deb' -o -name '*.dmg' -o -name '*.tar.gz' \) | sed 's|^\./||' | sort | xargs shasum -a 256 > SHA256SUMS)
          cat dist/SHA256SUMS
          minisign -Sm dist/SHA256SUMS -s "$key"
          ls -l dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.deb
            dist/*.dmg
            dist/*.tar.gz
      - name: Generate the changes section
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4.9.0
        with:
          # Same version as the mise pin, so local and CI output match.
          version: v2.14.1
          config: cliff.toml
          args: --latest --github-repo ${{ github.repository }} --output ${{ runner.temp }}/release-changes.md
        env:
          # Authenticates the pull request lookups; unauthenticated ones are rate limited.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Changes since the previous release come from cliff.toml, above the
          # shared platform, artifact and verification details.
          previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          changes="${{ runner.temp }}/release-changes.md"
          notes=$(mktemp)
          {
            echo "## Changes since ${previous_tag:-the previous release}"
            echo
            if [ -s "$changes" ]; then
              # The template opens with blank lines; drop them above the heading.
              awk 'NF { emit = 1 } emit' "$changes"
            else
              echo "- Initial release"
            fi
            echo
            sed "s/X\.Y\.Z/${GITHUB_REF_NAME#v}/g" .github/release-notes.md
          } > "$notes"
          # First matrix job creates the release; the rest append their assets.
          gh release create "$GITHUB_REF_NAME" \
            --title "Foglio $GITHUB_REF_NAME" \
            --notes-file "$notes" dist/* \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          rm -f "$notes"
