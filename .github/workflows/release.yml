name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and attach Linux artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install native desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build release tarball and Debian package
        run: bash scripts/package-linux.sh
      - name: Build CLI-only tarball
        run: bash scripts/package-release.sh
      - name: Verify artifacts exist
        run: |
          ls -l target/release/foglio-notes-v*-linux-x86_64.tar.gz
          ls -l target/release/bundle/deb/*.deb
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Foglio $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            target/release/foglio-notes-v*-linux-x86_64.tar.gz \
            target/release/bundle/deb/*.deb
