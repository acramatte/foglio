name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (deb + CLI tarball)
            runs-on: ubuntu-24.04
          - name: macOS arm64 (dmg + CLI tarball)
            runs-on: macos-latest
          - name: macOS x86_64 (dmg + CLI tarball)
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build Linux Debian package and CLI tarball
        if: runner.os == 'Linux'
        run: |
          bash scripts/package-linux.sh
          bash scripts/package-release.sh
      - name: Add macOS cross-compilation target
        if: matrix.name == 'macOS x86_64 (dmg + CLI tarball)'
        run: rustup target add x86_64-apple-darwin
      - name: Build macOS dmg and CLI tarball
        if: runner.os == 'macOS'
        run: |
          cd apps/desktop
          npm ci
          npm run typecheck
          npm run tauri -- build --bundles dmg ${{ matrix.name == 'macOS x86_64 (dmg + CLI tarball)' && '--target x86_64-apple-darwin' || '--target aarch64-apple-darwin' }} -- --locked
          cd ../..
          bash scripts/package-release.sh
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find target -path '*bundle/deb/*.deb' -exec cp {} dist/ \;
          find target -path '*bundle/dmg/*.dmg' -exec cp {} dist/ \;
          cp target/release/foglio-notes-v*-*.tar.gz dist/
          ls -l dist/
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # First matrix job creates the release; the rest append their assets.
          gh release create "$GITHUB_REF_NAME" \
            --title "Foglio $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md dist/* \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
