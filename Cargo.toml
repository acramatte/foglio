[workspace]
members = ["crates/notes-core", "crates/notes-cli", "apps/desktop/src-tauri"]
default-members = ["crates/notes-core", "crates/notes-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[workspace.dependencies]
notes-core = { path = "crates/notes-core" }
clap = { version = "=4.5.60", features = ["derive"] }
tempfile = "=3.26.0"

[workspace.lints.rust]
unsafe_code = "forbid"
